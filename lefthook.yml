pre-commit:
  commands:
    format:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc}"
      run: bun oxfmt --write --no-error-on-unmatched-pattern {staged_files} && git update-index --again

    lint:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc}"
      run: bun oxlint --fix --no-error-on-unmatched-pattern {staged_files} && git update-index --again

pre-push:
  commands:
    test:
      run: bun test
